# MIVIA Rover - kernel network tuning
#
# Larger UDP socket receive buffers for high-rate sensor streams (Velodyne
# VLP-16: ~9 Mbit/s of point-cloud UDP delivered in per-revolution bursts) and
# for DDS. With the stock Jetson default (~208 KB) the receive queue overflows
# under load and the point-cloud rate becomes erratic (bursts + multi-100 ms
# stalls); 25 MB removes the drops.
#
# Installed into /etc/sysctl.d/ by system_configuration/reload_services.sh.

net.core.rmem_max = 26214400
net.core.rmem_default = 26214400
